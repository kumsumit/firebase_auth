name: firebase_auth
description: Flutter plugin for Firebase Auth, enabling
  authentication using passwords, phone numbers and identity providers
  like Google, Facebook and Twitter.
homepage: https://firebase.google.com/docs/auth
repository: https://github.com/firebase/flutterfire/tree/main/packages/firebase_auth/firebase_auth
version: 6.6.1
publish_to: none

topics:
  - firebase
  - authentication
  - identity
  - sign-in
  - sign-up

false_secrets:
  - example/**

environment:
  sdk: '^3.13.0'
  flutter: '>=3.47.0'

dependencies:
  firebase_auth_platform_interface: 
    git: https://github.com/kumsumit/firebase_auth_platform_interface.git
  firebase_auth_web: 
    git: https://github.com/kumsumit/firebase_auth_web.git
  firebase_core:
    git: https://github.com/kumsumit/firebase_core.git
  firebase_core_platform_interface: 
    git: https://github.com/kumsumit/firebase_core_platform_interface.git
  flutter:
    sdk: flutter
  meta: ^1.19.0
dev_dependencies:
  async: ^2.13.1
  flutter_test:
    sdk: flutter
  mockito: ^5.8.1
  plugin_platform_interface: 
    git: https://github.com/kumsumit/plugin_platform_interface.git

flutter:
  plugin:
    platforms:
      android:
        package: io.flutter.plugins.firebase.auth
        pluginClass: FlutterFirebaseAuthPlugin
      ios:
        pluginClass: FLTFirebaseAuthPlugin
      macos:
        pluginClass: FLTFirebaseAuthPlugin
      web:
        default_package: firebase_auth_web
      windows:
        pluginClass: FirebaseAuthPluginCApi

